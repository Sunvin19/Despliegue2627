name: CI Validar y Testear

on:
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar HTML (html-validate)
        run: npx html-validate index.html

      - name: Linting CSS (stylelint)
        run: npx stylelint "css/**/*.css" --config stylelint-config-standard

      - name: Linting JavaScript (eslint)
        run: |
          npx eslint js/**/*.js --no-config-lookup --rule '{"semi": "off"}'

      - name: Ejecutar tests unitarios
        run: npm test